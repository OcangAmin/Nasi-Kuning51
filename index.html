<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
<title>POS Nasi Kuning 51 - Ultimate Edition</title>
<!-- jsPDF: untuk membuat rekap Tutup Kasir dalam bentuk PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
  :root {
    --brand-maroon: #632626; --brand-gold: #c6943d; --brand-light: #f5f5f5;
    --white: #ffffff; --border: rgba(255, 255, 255, 0.2); --green-success: #28a745;
    --red-danger: #dc3545;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: var(--brand-light); color: #333; overflow-x: hidden; }
  .container { max-width: 420px; margin: 0 auto; min-height: 100vh; padding-bottom: 220px; }
  
  /* HEADER */
  .header-box { 
    background: var(--brand-maroon); color: var(--white); padding: 15px; 
    display: flex; align-items: center; gap: 12px; position: sticky; top: 0; 
    z-index: 100; border-bottom: 3px solid var(--brand-gold);
  }
  .logo-img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--brand-gold); background: white; object-fit: cover; }
  .user-name { font-size: 16px; font-weight: 700; text-transform: uppercase; }

  /* TABS MENU */
  .tabs-container { display: flex; gap: 10px; padding: 15px; background: var(--brand-light); }
  .tab-item { flex: 1; padding: 12px; text-align: center; background: var(--white); border: 2px solid var(--brand-gold); border-radius: 25px; cursor: pointer; font-size: 13px; font-weight: 800; color: var(--brand-gold); transition: 0.3s; }
  .tab-item.active { background: var(--brand-gold); color: var(--white); }

  /* GRID MENU */
  .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 15px; }
  .menu-card { background: var(--brand-maroon); border-radius: 12px; padding: 12px; border: 2px solid var(--brand-gold); cursor: pointer; color: var(--white); display: flex; flex-direction: column; justify-content: space-between; min-height: 85px; }
  .menu-name { font-size: 11px; font-weight: 800; text-transform: uppercase; }
  .menu-price { font-size: 13px; color: var(--brand-gold); font-weight: 700; text-align: right; border-top: 1px solid var(--border); padding-top: 5px; }

  /* EFEK TEKAN MENU */
  .menu-card { position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; transition: transform 0.1s ease; }
  .menu-card:active { transform: scale(0.94); }
  .menu-card.tapped { animation: cardPop 0.35s ease; }
  @keyframes cardPop {
    0% { transform: scale(0.92); box-shadow: 0 0 0 0 rgba(198, 148, 61, 0.8); }
    60% { transform: scale(1.04); }
    100% { transform: scale(1); box-shadow: 0 0 0 12px rgba(198, 148, 61, 0); }
  }
  .ripple { position: absolute; border-radius: 50%; background: rgba(198, 148, 61, 0.45); transform: scale(0); animation: ripple 0.5s ease-out forwards; pointer-events: none; }
  @keyframes ripple { to { transform: scale(2.5); opacity: 0; } }
  .plus-one { position: absolute; top: 35%; right: 12px; font-size: 18px; font-weight: 800; color: var(--brand-gold); pointer-events: none; animation: floatUp 0.7s ease-out forwards; }
  @keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-24px); } }
  #totalHarga { display: inline-block; }
  #totalHarga.bump { animation: bump 0.3s ease; }
  @keyframes bump { 50% { transform: scale(1.25); color: var(--brand-gold); } }
  @media (prefers-reduced-motion: reduce) {
    .menu-card.tapped, .ripple, .plus-one, #totalHarga.bump { animation: none; }
    .ripple, .plus-one { display: none; }
  }

  /* KERANJANG */
  .card-box { background: var(--brand-maroon); border-radius: 15px; margin: 10px 15px; padding: 15px; color: var(--white); }
  .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .qty-btn { background: var(--brand-gold); border: none; color: white; border-radius: 5px; padding: 5px 10px; font-weight: bold; }
  .delete-btn { background: var(--red-danger); color: white; border: none; border-radius: 5px; padding: 5px 8px; font-weight: bold; margin-left: 5px; cursor: pointer; }

  /* PEMBAYARAN */
  .pay-card { background: var(--white); border-radius: 15px; margin: 10px 15px; padding: 15px; border: 1px solid #ddd; }
  input[type="number"] { width: 100%; border: 2px solid #ddd; border-radius: 10px; padding: 12px; font-size: 18px; font-weight: 700; margin: 10px 0; text-align: right; outline: none; }
  .quick-pay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .small-btn { padding: 12px 5px; background: var(--brand-maroon); color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

  /* ACTION BAR & NAV */
  .action-bar { position: fixed; bottom: 70px; left: 0; right: 0; background: var(--brand-light); padding: 10px 15px; display: flex; gap: 10px; z-index: 900; }
  .btn-main-action { flex: 3; padding: 18px; border-radius: 12px; border: none; font-weight: 800; background: var(--brand-maroon); color: white; cursor: pointer; }
  .btn-reset-action { flex: 1; padding: 18px; border-radius: 12px; border: 2px solid var(--brand-gold); background: white; color: var(--brand-gold); font-size: 12px; font-weight: 800; cursor: pointer; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; height: 70px; display: flex; border-top: 1px solid #eee; z-index: 1000; }
  .nav-item { text-align: center; color: var(--brand-maroon); font-size: 11px; cursor: pointer; flex: 1; opacity: 0.4; padding-top: 15px; transition: 0.3s; }
  .nav-item.active { opacity: 1; font-weight: 800; }
  
  /* HISTORY CARD */
  .hist-card { background:white; padding:15px; border-radius:12px; margin-bottom:12px; border-left:6px solid var(--brand-maroon); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .share-btn { background: #25D366; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; font-weight: 800; margin-top: 10px; cursor: pointer; }
  .print-btn { background: #333; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; font-weight: 800; margin-top: 5px; cursor: pointer; }
  
  .hide { display: none; }
  .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 2000; }
  .popup { width: 85%; background: white; border-radius: 20px; padding: 25px; text-align: center; }
  .confirm-row { display: flex; justify-content: space-between; margin: 10px 0; font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 5px; }

  /* SEARCH & FILTER AREA */
  .search-container { padding: 10px 15px; background: white; border-bottom: 1px solid #ddd; display: flex; gap: 8px; position: sticky; top: 93px; z-index: 99; }
  .filter-select { flex: 1; padding: 10px; border: 2px solid var(--brand-gold); border-radius: 10px; font-size: 13px; font-weight: 700; background: white; }
  .search-input { flex: 2; padding: 10px; border: 2px solid var(--brand-gold); border-radius: 10px; font-size: 14px; outline: none; }

  /* CABANG */
  .cabang-chip { margin-left: auto; background: var(--brand-gold); color: var(--white); border-radius: 20px; padding: 8px 12px; font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .cabang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
  .cabang-option { padding: 16px 8px; border-radius: 12px; border: 2px solid var(--brand-gold); background: var(--white); color: var(--brand-maroon); font-weight: 800; font-size: 14px; cursor: pointer; }
  .cabang-option small { display: block; font-weight: 600; font-size: 10px; color: #888; margin-top: 4px; }
  .cabang-option.active { background: var(--brand-maroon); color: var(--brand-gold); }
  .cabang-option.active small { color: #ddd; }
</style>
</head>
<body>

<div class="container">
  <div class="header-box">
    <img src="https://i.ibb.co.com/8nkwdhSQ/IMG-3379.png" alt="Logo" class="logo-img">
    <div class="header-info">
      <div style="font-size: 9px; opacity: 0.8;">KASIR AKTIF</div>
      <div class="user-name" id="kasirName"></div>
      <div style="font-weight: 800; font-size: 11px; color: var(--brand-gold);">NASI KUNING 51</div>
    </div>
    <div class="cabang-chip" onclick="openCabangPicker()">📍 <span id="cabangLabel">PILIH CABANG</span> ▾</div>
  </div>

  <div id="pageTransaksi">
    <div class="tabs-container">
      <div class="tab-item active" id="tabUtama" onclick="setMenuTab('utama')">UTAMA</div>
      <div class="tab-item" id="tabAdd" onclick="setMenuTab('additional')">TAMBAHAN</div>
    </div>

    <div class="menu-grid" id="menuGrid"></div>

    <div class="card-box">
      <div id="cartList"></div>
      <div style="display: flex; justify-content: space-between; margin-top: 10px; font-weight: 800; border-top: 1px solid var(--border); padding-top: 10px; font-size: 18px;">
        <span>Total</span><span id="totalHarga">0</span>
      </div>
    </div>

    <div class="pay-card">
      <div style="display: flex; gap: 5px; margin-bottom: 10px;">
        <button class="tab-item pay-btn" id="btnCash" onclick="setPayment('cash')">CASH</button>
        <button class="tab-item pay-btn" id="btnQris" onclick="setPayment('qris')">QRIS</button>
        <button class="tab-item pay-btn" id="btnFree" style="border-color:var(--green-success); color:var(--green-success);" onclick="setPayment('free')">FREE</button>
      </div>
      <input type="number" id="uangBayar" placeholder="0" oninput="calculateChange()" inputmode="numeric">
      <div class="quick-pay-grid" id="quickPayArea">
        <button class="small-btn q-btn" onclick="setQuick(5000)">5K</button>
        <button class="small-btn q-btn" onclick="setQuick(10000)">10K</button>
        <button class="small-btn q-btn" onclick="setQuick(20000)">20K</button>
        <button class="small-btn q-btn" onclick="setQuick(50000)">50K</button>
        <button class="small-btn q-btn" onclick="setQuick(100000)">100K</button>
        <button class="small-btn q-btn" style="background:var(--brand-gold)" onclick="setExact()">PAS</button>
      </div>
      <button class="small-btn q-btn" style="background:#888; width: 100%; margin-bottom:10px;" onclick="clearUangBayar()">HAPUS NOMINAL</button>
      
      <div style="display: flex; justify-content: space-between; font-weight: 800; color: var(--brand-maroon); font-size: 16px;">
        <span>Kembalian</span><span id="kembalian">0</span>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn-reset-action" onclick="resetCart()">RESET</button>
      <button class="btn-main-action" onclick="completeTransaction()">BAYAR SEKARANG</button>
    </div>
  </div>

  <div id="pageHistory" class="hide">
    <div class="search-container">
      <select id="filterType" class="filter-select" onchange="filterHistory()">
        <option value="all">SEMUA</option>
        <option value="id">ID NOTA</option>
        <option value="lauk">LAUK</option>
        <option value="metode">METODE</option>
      </select>
      <input type="text" id="searchInput" class="search-input" placeholder="Cari transaksi..." onkeyup="filterHistory()">
    </div>
    
    <div style="padding: 15px; font-weight: 800; color: var(--brand-maroon);">RIWAYAT CABANG <span id="histCabang"></span> SEJAK TUTUP KASIR TERAKHIR</div>
    <div id="historyList" style="padding: 0 15px;"></div>

    <div style="padding: 20px 15px; display: flex; flex-direction: column; gap: 10px;">
      <button class="btn-main-action" style="background:#28a745" onclick="saveHistory()">💾 SIMPAN LOG (.TXT)</button>
      <button class="btn-main-action" style="background:var(--brand-gold)" onclick="closeCashier()">🏁 TUTUP KASIR & KIRIM REKAP PDF</button>
      <button class="btn-reset-action" style="border-color:#dc3545; color:#dc3545" onclick="resetHistory()">🗑️ RESET SEMUA DATA</button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <div class="nav-item active" id="navHome" onclick="showTab('transaksi')">🏠<div>Beranda</div></div>
  <div class="nav-item" id="navHist" onclick="showTab('history')">📋<div>Laporan</div></div>
</nav>

<div id="confirmPopup" class="hide">
  <div class="popup-overlay"><div class="popup">
    <h3 id="popupTitle" style="color:var(--brand-maroon)">Konfirmasi</h3>
    <div id="popupDetails" style="text-align: left; margin-bottom: 20px; font-size:14px;"></div>
    <button class="btn-main-action" style="width:100%; margin:5px 0" onclick="finalize()">KONFIRMASI</button>
    <button class="btn-reset-action" style="width:100%; margin:5px 0" onclick="closePopup()">BATAL</button>
  </div></div>
</div>

<div id="cabangPopup" class="hide">
  <div class="popup-overlay"><div class="popup">
    <h3 style="color:var(--brand-maroon); margin-bottom:5px;">Pilih Cabang</h3>
    <div style="font-size:12px; color:#666;">Transaksi di HP ini akan tercatat untuk cabang yang dipilih.</div>
    <div class="cabang-grid" id="cabangGrid"></div>
    <button class="btn-reset-action" id="cabangCancel" style="width:100%; margin:5px 0" onclick="closeCabangPicker()">BATAL</button>
  </div></div>
</div>

<div id="rekapPopup" class="hide">
  <div class="popup-overlay"><div class="popup">
    <h3 style="color:var(--brand-maroon)">Rekap Tutup Kasir</h3>
    <div id="rekapDetails" style="text-align: left; margin-bottom: 15px; font-size:14px;"></div>
    <button class="share-btn" style="padding:15px; font-size:14px;" onclick="shareRekap()">📲 KIRIM KE OWNER (WHATSAPP)</button>
    <button class="print-btn" style="padding:12px;" onclick="downloadRekap()">⬇️ DOWNLOAD FILE</button>
    <button class="btn-main-action" style="width:100%; margin:15px 0 5px" onclick="finishCloseCashier()">✅ SELESAI & TUTUP KASIR</button>
    <button class="btn-reset-action" style="width:100%; margin:5px 0" onclick="closeRekapPopup()">BATAL</button>
  </div></div>
</div>

<script>
  const warungInfo = {
    kasir: "HALILINTAR BUCEK",
    ig: "@naskun_kolaka51",
    wa: "+62 878-4186-2086",
    lokasi: [
        "📍 1. PRAMUKA Depan (IMAJINASI)",
        "📍 2. DERMAGA (PANTAI)",
        "📍 3. PEMUDA Lalomba (Dpn LPNG Konggoasa)",
        "📍 4. ABADI (Lrg KDRT)"
    ]
  };

  const menus = [
    {name:"NASI KUNING AYAM", price:15000, type:"utama"}, {name:"NASI KUNING IKAN", price:13000, type:"utama"},
    {name:"NASI KUNING TELUR", price:10000, type:"utama"}, {name:"NASI KUNING AYAM TELUR", price:23000, type:"utama"},
    {name:"NASI KUNING IKAN TELUR", price:20000, type:"utama"}, {name:"IKAN", price:5000, type:"additional"},
    {name:"BAKWAN", price:2000, type:"additional"}, {name:"NASI", price:5000, type:"additional"},
    {name:"TELUR", price:5000, type:"additional"}, {name:"AYAM", price:5000, type:"additional"},
    {name:"AIR MINERAL", price:5000, type:"additional"},
  ];

  // Kode cabang dipakai di ID nota (NK51-DRM-...) agar nota antar cabang tidak bentrok
  const cabangList = [
    {id:"PRM", name:"PRAMUKA", alamat:"Depan (IMAJINASI)"},
    {id:"DRM", name:"DERMAGA", alamat:"(PANTAI)"},
    {id:"PMD", name:"PEMUDA", alamat:"Lalomba (Dpn LPNG Konggoasa)"},
    {id:"ABD", name:"ABADI", alamat:"(Lrg KDRT)"},
  ];

  let cart = []; let history = []; let paymentMethod = ""; let currentMenuTab = "utama";
  let activeCabang = localStorage.getItem("naskun51_cabang") || "";

  function getCabang(id){ return cabangList.find(c => c.id === id); }
  function cabangName(id){ const c = getCabang(id); return c ? c.name : "-"; }
  function cabangHistory(){ return history.filter(h => h.cabang === activeCabang); }

  function renderCabang(){
    document.getElementById("cabangLabel").innerText = activeCabang ? cabangName(activeCabang) : "PILIH CABANG";
    document.getElementById("histCabang").innerText = cabangName(activeCabang);
  }
  // mandatory: dipakai saat HP belum pernah memilih cabang, jadi tombol BATAL disembunyikan
  function openCabangPicker(mandatory = false){
    document.getElementById("cabangGrid").innerHTML = cabangList.map(c => `<button class="cabang-option ${c.id === activeCabang ? 'active' : ''}" onclick="setCabang('${c.id}')">${c.name}<small>${c.alamat}</small></button>`).join("");
    document.getElementById("cabangCancel").classList.toggle("hide", mandatory || !activeCabang);
    document.getElementById("cabangPopup").classList.remove("hide");
  }
  function closeCabangPicker(){ document.getElementById("cabangPopup").classList.add("hide"); }
  function setCabang(id){
    if(activeCabang && id !== activeCabang && !confirm(`Ganti cabang ke ${cabangName(id)}?\nTransaksi berikutnya akan tercatat untuk cabang ${cabangName(id)}.`)) return;
    // Transaksi lama (sebelum ada fitur cabang) dianggap milik cabang pertama yang dipilih
    if(!activeCabang) history.forEach(h => { if(!h.cabang) h.cabang = id; });
    activeCabang = id; localStorage.setItem("naskun51_cabang", id); saveToStorage();
    renderCabang(); closeCabangPicker();
    if(!document.getElementById("pageHistory").classList.contains("hide")) renderHistory();
  }

  function saveToStorage(){ localStorage.setItem("naskun51_cart", JSON.stringify(cart)); localStorage.setItem("naskun51_history", JSON.stringify(history)); }
  function loadFromStorage(){ cart = JSON.parse(localStorage.getItem("naskun51_cart")) || []; history = JSON.parse(localStorage.getItem("naskun51_history")) || []; renderCart(); calculateTotal(); }
  function getNum(id) { const el = document.getElementById(id); let val = (el.tagName === "INPUT") ? el.value : el.innerText; return parseInt(val.toString().replace(/\D/g, '')) || 0; }

  function setMenuTab(tab){ currentMenuTab = tab; document.getElementById("tabUtama").classList.toggle("active", tab==='utama'); document.getElementById("tabAdd").classList.toggle("active", tab==='additional'); renderMenu(); }
  function renderMenu(){ const grid = document.getElementById("menuGrid"); grid.innerHTML = menus.filter(m => m.type === currentMenuTab).map(m => `<div class="menu-card" onclick="addToCart('${m.name}', ${m.price}, this, event)"><div class="menu-name">${m.name}</div><div class="menu-price">Rp ${m.price.toLocaleString('id-ID')}</div></div>`).join(""); }
  function addToCart(name, price, el, ev){ const item = cart.find(i => i.name === name); if(item) item.qty++; else cart.push({name, price, qty:1}); renderCart(); calculateTotal(); saveToStorage(); if(el) playTapEffect(el, ev); }

  // Efek saat menu ditekan: kartu memantul, gelombang dari titik sentuh, "+1" melayang, getar singkat, total berdenyut
  function playTapEffect(el, ev){
    if(navigator.vibrate) navigator.vibrate(15);
    restartAnim(el, "tapped");
    restartAnim(document.getElementById("totalHarga"), "bump");

    const rect = el.getBoundingClientRect(); const size = Math.max(rect.width, rect.height);
    const x = (ev && ev.clientX ? ev.clientX : rect.left + rect.width / 2) - rect.left;
    const y = (ev && ev.clientY ? ev.clientY : rect.top + rect.height / 2) - rect.top;
    const ripple = document.createElement("span"); ripple.className = "ripple";
    ripple.style.cssText = `width:${size}px; height:${size}px; left:${x - size / 2}px; top:${y - size / 2}px;`;
    const plus = document.createElement("span"); plus.className = "plus-one"; plus.textContent = "+1";
    el.append(ripple, plus);
    setTimeout(() => { ripple.remove(); plus.remove(); }, 800);
  }
  function restartAnim(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  
  function renderCart(){ 
    const list = document.getElementById("cartList"); 
    list.innerHTML = cart.map((i, idx) => `
      <div class="cart-item">
        <div style="flex: 2;"><b>${i.name}</b><br><small>Rp ${i.price.toLocaleString('id-ID')}</small></div>
        <div style="flex: 1; display: flex; align-items: center; gap: 8px; justify-content: flex-end;">
          <button class="qty-btn" onclick="changeQty(${idx},-1)">-</button> 
          <span style="min-width: 20px; text-align: center;">${i.qty}</span> 
          <button class="qty-btn" onclick="changeQty(${idx},1)">+</button>
          <button class="delete-btn" onclick="removeFromCart(${idx})">X</button>
        </div>
      </div>`).join(""); 
  }
  
  function changeQty(idx, delta){ cart[idx].qty += delta; if(cart[idx].qty <= 0) cart.splice(idx,1); renderCart(); calculateTotal(); saveToStorage(); }
  function removeFromCart(idx){ if(confirm("Hapus " + cart[idx].name + "?")){ cart.splice(idx,1); renderCart(); calculateTotal(); saveToStorage(); } }
  function calculateTotal(){ let total = 0; cart.forEach(i => { total += (i.price*i.qty); }); document.getElementById("totalHarga").innerText = total.toLocaleString('id-ID'); if(paymentMethod === 'qris') document.getElementById("uangBayar").value = total; calculateChange(); }

  function setPayment(m){ 
    paymentMethod = m; const inputBayar = document.getElementById("uangBayar"); const qButtons = document.querySelectorAll(".q-btn");
    document.querySelectorAll('.pay-btn').forEach(el => el.classList.remove('active'));
    document.getElementById("btn" + m.charAt(0).toUpperCase() + m.slice(1))?.classList.add('active');
    if(m==='qris' || m==='free') { inputBayar.value = (m==='qris') ? getNum("totalHarga") : 0; inputBayar.readOnly = true; qButtons.forEach(b => b.disabled = true); } 
    else { inputBayar.readOnly = false; inputBayar.value = ""; qButtons.forEach(b => b.disabled = false); }
    calculateChange();
  }
  function calculateChange(){ const total = getNum("totalHarga"); const bayar = getNum("uangBayar"); const change = (paymentMethod === 'free' || paymentMethod === 'qris') ? 0 : bayar - total; document.getElementById("kembalian").innerText = change >= 0 ? change.toLocaleString('id-ID') : "0"; }
  function setQuick(amt){ if(paymentMethod !== 'cash') return; document.getElementById("uangBayar").value = getNum("uangBayar") + amt; calculateChange(); }
  function setExact(){ if(paymentMethod !== 'cash') return; document.getElementById("uangBayar").value = getNum("totalHarga"); calculateChange(); }
  function clearUangBayar(){ if(paymentMethod !== 'cash') return; document.getElementById("uangBayar").value = ""; calculateChange(); }

  function completeTransaction(){
    const total = getNum("totalHarga"); const bayar = getNum("uangBayar");
    if(cart.length === 0){ alert("Keranjang masih kosong!"); return; }
    if(!activeCabang){ alert("Pilih cabang dulu!"); openCabangPicker(true); return; }
    if(!paymentMethod){ alert("Pilih metode pembayaran!"); return; }
    const details = document.getElementById("popupDetails");
    if(paymentMethod === "qris") {
      document.getElementById("popupTitle").innerText = "Konfirmasi QRIS";
      details.innerHTML = `<p>Konfirmasi pembayaran QRIS senilai <b>Rp ${total.toLocaleString('id-ID')}</b>?</p>`;

    } else if(paymentMethod === "cash") {
      if(bayar < total) { alert("Uang bayar kurang!"); return; }
      document.getElementById("popupTitle").innerText = "Konfirmasi Cash";
      details.innerHTML = `<div class="confirm-row"><span>Total:</span><span>Rp ${total.toLocaleString('id-ID')}</span></div><div class="confirm-row"><span>Bayar:</span><span>Rp ${bayar.toLocaleString('id-ID')}</span></div><div class="confirm-row"><span>Kembali:</span><span>Rp ${getNum("kembalian").toLocaleString('id-ID')}</span></div>`;

      document.getElementById("popupTitle").innerText = "Konfirmasi FREE";
      details.innerHTML = `<p>Catat sebagai <b>FREE (Sedekah)</b> senilai <b>Rp ${total.toLocaleString('id-ID')}</b>?</p>`;
      openPopup();
    }
  }

  // Nomor nota berurutan per hari: NK51-DRM-YYYYMMDD-001. Counter disimpan terpisah agar tidak terulang walau riwayat di-reset.
  function generateNotaID(now){
    const pad = (n, w) => String(n).padStart(w, '0');
    const date = `${now.getFullYear()}${pad(now.getMonth()+1, 2)}${pad(now.getDate(), 2)}`;
    let seq = { date: "", n: 0 };
    try { seq = JSON.parse(localStorage.getItem("naskun51_seq")) || seq; } catch(e) {}
    if(seq.date !== date) seq = { date, n: 0 };
    let id;
    do { seq.n++; id = `NK51-${activeCabang}-${date}-${pad(seq.n, 3)}`; } while(history.some(h => h.id === id));
    localStorage.setItem("naskun51_seq", JSON.stringify(seq));
    return id;
  }

  function finalize(){
    const rt = getNum("totalHarga"); const bayar = getNum("uangBayar"); const m = paymentMethod;
    const cg = (m === 'free' || m === 'qris') ? 0 : bayar - rt;
    const now = new Date();
    history.push({
        id: generateNotaID(now),
        cabang: activeCabang,
        time: now.toLocaleString('id-ID'),
        ts: now.getTime(),
        items: JSON.parse(JSON.stringify(cart)), 
        total: (m === 'free' ? 0 : rt), 
        realValue: rt, 
        bayar: (m === 'qris' ? rt : (m === 'free' ? 0 : bayar)), 
        change: cg, 
        paymentMethod: m 
    });
    cart = []; paymentMethod = ""; closePopup(); resetUI(); saveToStorage(); alert("Transaksi Berhasil!");
  }

  async function printBluetooth(id) {
    const d = history.find(h => h.id === id); if (!d) return;
    let text = `\x1B\x61\x01NASI KUNING 51\nBukti Pembayaran Digital\n--------------------------------\n\x1B\x61\x00ID    : ${d.id}\nTgl   : ${d.time}\nCabang: ${cabangName(d.cabang)}\nKasir : ${warungInfo.kasir}\n--------------------------------\n`;
    d.items.forEach(i => { text += `${i.name.toUpperCase()}\n${i.qty} x ${i.price.toLocaleString('id-ID')} = Rp ${(i.price*i.qty).toLocaleString('id-ID')}\n`; });
    text += `--------------------------------\nTOTAL      : Rp ${d.total.toLocaleString('id-ID')}\nBAYAR (${d.paymentMethod.toUpperCase()}) : Rp ${d.bayar.toLocaleString('id-ID')}\nKEMBALI     : Rp ${d.change.toLocaleString('id-ID')}\n--------------------------------\nTerima Kasih!\n\n\n\n`;
    try {
      const device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }], optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] });
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
      const char = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
      const enc = new TextEncoder(); const data = enc.encode(text);
      for (let i = 0; i < data.length; i += 20) { await char.writeValue(data.slice(i, i + 20)); }
    } catch (e) { alert("Bluetooth Error: " + e.message); }
  }

  // Ringkasan omzet & produk dari daftar transaksi; dipakai dashboard, laporan .txt, dan rekap PDF
  function summarize(list) {
    const s = { omzet: 0, cash: 0, qris: 0, freeVal: 0, nCash: 0, nQris: 0, nFree: 0, lBayar: {}, lFree: {} };
    list.forEach(h => {
        if(h.paymentMethod === 'cash') { s.omzet += h.total; s.cash += h.total; s.nCash++; }
        else if(h.paymentMethod === 'qris') { s.omzet += h.total; s.qris += h.total; s.nQris++; }
        else if(h.paymentMethod === 'free') { s.freeVal += h.realValue; s.nFree++; }
        const bucket = h.paymentMethod === 'free' ? s.lFree : s.lBayar;
        h.items.forEach(i => {
            bucket[i.name] = bucket[i.name] || { qty: 0, value: 0 };
            bucket[i.name].qty += i.qty; bucket[i.name].value += i.price * i.qty;
        });
    });
    return s;
  }

  // Bagikan file lewat menu Bagikan HP (WhatsApp, dll); bila tidak didukung, file di-download
  async function shareFile(file, tujuan){
    if(navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: file.name }); }
      catch(e) { if(e.name !== "AbortError") { downloadFile(file.name, file); alert(`Gagal membagikan file: ${e.message}\nFile sudah di-download, lampirkan manual di WhatsApp ke ${tujuan}.`); } }
    } else {
      // Download dulu sebelum alert: alert bisa menghabiskan izin klik sehingga download diblokir browser
      downloadFile(file.name, file);
      alert(`HP/browser ini tidak bisa mengirim file langsung.\nFile sudah di-download, lampirkan manual di WhatsApp ke ${tujuan}.`);
    }
  }
  function shareRekap(){ if(rekap) shareFile(rekap.file, "owner"); }

  // Membuat PDF nota selebar struk (80mm). Digambar dua kali: pertama untuk mengukur tinggi, lalu di halaman seukuran isinya.
  // Melempar error bila jsPDF belum termuat.
  function buildNotaPDF(d){
    const { jsPDF } = window.jspdf;
    const W = 80, M = 5;
    const maroon = [99, 38, 38], gold = [198, 148, 61], green = [40, 167, 69];
    const rp = n => "Rp " + n.toLocaleString('id-ID');
    const isFree = d.paymentMethod === "free";

    const draw = doc => {
      const dashed = y => { doc.setDrawColor(170); doc.setLineWidth(0.2); doc.setLineDashPattern([1, 1], 0); doc.line(M, y, W - M, y); doc.setLineDashPattern([], 0); };
      const row = (k, v, y, bold = false) => {
        doc.setFont("helvetica", bold ? "bold" : "normal"); doc.text(k, M, y); doc.text(v, W - M, y, { align: "right" });
      };

      // Kop
      doc.setFillColor(...maroon); doc.rect(0, 0, W, 24, "F");
      doc.setFillColor(...gold); doc.rect(0, 24, W, 1, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.setTextColor(...gold); doc.text("NASI KUNING 51", W / 2, 11, { align: "center" });
      doc.setFontSize(9); doc.setTextColor(255); doc.text("BUKTI PEMBAYARAN", W / 2, 17, { align: "center" });
      doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.text(`Cabang ${cabangName(d.cabang)}`, W / 2, 21.5, { align: "center" });
      let y = 31;

      // Info nota
      doc.setFontSize(8); doc.setTextColor(51);
      [["No. Nota", d.id], ["Tanggal", d.time], ["Cabang", cabangName(d.cabang)], ["Kasir", warungInfo.kasir], ["Metode", d.paymentMethod.toUpperCase()]]
        .forEach(([k, v]) => { row(k, v, y); y += 4.5; });
      dashed(y - 1.5); y += 4;

      // Item
      d.items.forEach(i => {
        doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(34);
        const lines = doc.splitTextToSize(i.name.toUpperCase(), W - 2 * M);
        doc.text(lines, M, y); y += lines.length * 3.8;
        doc.setFontSize(8); doc.setTextColor(102); doc.setFont("helvetica", "normal"); doc.text(`${i.qty} x ${i.price.toLocaleString('id-ID')}`, M, y);
        doc.setTextColor(34); doc.setFont("helvetica", "bold"); doc.text(rp(i.price * i.qty), W - M, y, { align: "right" });
        y += 5.5;
      });
      dashed(y - 2); y += 4;

      // Total
      doc.setFontSize(11); doc.setTextColor(...maroon); row("TOTAL", rp(d.total), y, true); y += 6;
      doc.setFontSize(8); doc.setTextColor(51);
      if(isFree) { row("Nilai pesanan", rp(d.realValue), y); y += 4.5; }
      row(`Bayar (${d.paymentMethod.toUpperCase()})`, rp(d.bayar), y); y += 4.5;
      row("Kembali", rp(d.change), y); y += 6;

      // Cap status
      const stamp = isFree ? "GRATIS / SEDEKAH" : "LUNAS";
      doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(...green);
      const sw = Math.max(36, doc.getTextWidth(stamp) + 10);
      doc.setDrawColor(...green); doc.setLineWidth(0.5); doc.roundedRect(W / 2 - sw / 2, y, sw, 8, 1.5, 1.5, "S");
      doc.text(stamp, W / 2, y + 5.5, { align: "center" });
      y += 14;
      dashed(y - 2); y += 4;

      // Kontak & lokasi
      doc.setFontSize(7.5); doc.setTextColor(51);
      doc.setFont("helvetica", "bold"); doc.text("HUBUNGI KAMI", M, y); y += 4;
      doc.setFont("helvetica", "normal"); doc.text(`IG: ${warungInfo.ig}`, M, y); y += 3.6; doc.text(`WA: ${warungInfo.wa}`, M, y); y += 5;
      doc.setFont("helvetica", "bold"); doc.text("LOKASI OUTLET", M, y); y += 4;
      doc.setFont("helvetica", "normal");
      cabangList.forEach((c, i) => { const lines = doc.splitTextToSize(`${i + 1}. ${c.name} ${c.alamat}`, W - 2 * M); doc.text(lines, M, y); y += lines.length * 3.6; });
      y += 3; dashed(y - 1); y += 5;
      doc.setFont("helvetica", "italic"); doc.setFontSize(8); doc.setTextColor(...maroon); doc.text("Terima kasih & Selamat Menikmati!", W / 2, y, { align: "center" });
      return y + 6;
    };

    const height = draw(new jsPDF({ unit: "mm", format: [W, 1000] }));
    const doc = new jsPDF({ unit: "mm", format: [W, height] });
    draw(doc);
    return doc.output("blob");
  }

      ["Transaksi terakhir", list[list.length - 1].time],
      ["Jumlah transaksi", `${list.length}x`],
    ];
    doc.setTextColor(51); doc.setFontSize(10);
    info.forEach(([k, v]) => { doc.setFont("helvetica", "normal"); doc.text(k, M, y); doc.setFont("helvetica", "bold"); doc.text(`: ${v}`, M + 38, y); y += 6; });
    y += 4;

    // Ringkasan omzet
    doc.setDrawColor(...gold); doc.setLineWidth(0.6); doc.roundedRect(M, y, W - 2 * M, 38, 3, 3, "S");
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(120); doc.text("TOTAL OMZET", M + 6, y + 9);
    doc.setFontSize(20); doc.setTextColor(...maroon); doc.text(rp(s.omzet), M + 6, y + 19);
    doc.setFontSize(10); doc.setTextColor(51);
    [[`Tunai (${s.nCash}x)`, s.cash], [`QRIS (${s.nQris}x)`, s.qris], [`FREE / Sedekah (${s.nFree}x)`, s.freeVal]].forEach(([k, v], i) => {
      const ry = y + 9 + i * 9;
      doc.setFont("helvetica", "normal"); doc.text(k, W / 2 + 5, ry);
      doc.setFont("helvetica", "bold"); doc.text(rp(v), W - M - 6, ry, { align: "right" });
    });
    y += 48;

    // Tabel sederhana; header diulang bila pindah halaman
    const table = (title, cols, rows) => {
      ensure(22);
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...maroon); doc.text(title, M, y); y += 4;
      const header = () => {
        doc.setFillColor(...maroon); doc.rect(M, y, W - 2 * M, 7, "F");
        doc.setFontSize(9); doc.setTextColor(255);
        cols.forEach(c => doc.text(c.label, c.x, y + 5, { align: c.align || "left" }));
        y += 7;
      };
      header();
      doc.setFont("helvetica", "normal"); doc.setTextColor(51);
      rows.forEach((r, i) => {
        if(y + 7 > H - 18) { doc.addPage(); y = 18; header(); doc.setFont("helvetica", "normal"); doc.setTextColor(51); }
        if(i % 2 === 1) { doc.setFillColor(245, 240, 232); doc.rect(M, y, W - 2 * M, 7, "F"); }
        cols.forEach((c, ci) => doc.text(String(r[ci]), c.x, y + 5, { align: c.align || "left" }));
        y += 7;
      });
      y += 8;
    };

    const produkCols = [{ label: "Produk", x: M + 3 }, { label: "Porsi", x: 140, align: "right" }, { label: "Nilai", x: W - M - 3, align: "right" }];
    const produkRows = obj => Object.keys(obj).sort((a, b) => obj[b].qty - obj[a].qty).map(k => [k, obj[k].qty, rp(obj[k].value)]);
    if(Object.keys(s.lBayar).length) table("REKAP PRODUK TERJUAL", produkCols, produkRows(s.lBayar));
    if(Object.keys(s.lFree).length) table("REKAP PRODUK FREE (SEDEKAH)", produkCols, produkRows(s.lFree));

    table("DETAIL TRANSAKSI",
      [{ label: "No", x: M + 3 }, { label: "ID Nota", x: M + 13 }, { label: "Waktu", x: 92 }, { label: "Metode", x: 142 }, { label: "Total", x: W - M - 3, align: "right" }],
      list.map((h, i) => [i + 1, h.id, h.time, h.paymentMethod.toUpperCase(), rp(h.total)]));

    // Footer tiap halaman
    const pages = doc.getNumberOfPages();
    for(let p = 1; p <= pages; p++) {
      doc.setPage(p); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(150);
      doc.text(`Dibuat otomatis oleh POS Nasi Kuning 51 - ${now.toLocaleString('id-ID')}`, M, H - 8);
      doc.text(`Hal ${p}/${pages}`, W - M, H - 8, { align: "right" });
    }
    return doc.output("blob");
  }
  function resetHistory(){ if(confirm("Hapus semua data riwayat secara permanen?")){ history=[]; saveToStorage(); renderHistory(); } }
  function resetCart(){ if(confirm("Reset keranjang?")){ cart=[]; resetUI(); saveToStorage(); } }
  function resetUI(){ document.getElementById("uangBayar").value = ""; renderCart(); calculateTotal(); setPayment(""); }
  function downloadFile(n, c){ const b = c instanceof Blob ? c : new Blob([c], {type:"text/plain"}); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = n; a.click(); }
  function openPopup(){ document.getElementById("confirmPopup").classList.remove("hide"); }
  function closePopup(){ document.getElementById("confirmPopup").classList.add("hide"); }

  // Agar efek :active (kartu mengecil saat ditekan) jalan di Safari iPhone
  document.addEventListener("touchstart", () => {}, { passive: true });

  document.getElementById("kasirName").innerText = warungInfo.kasir;
  loadFromStorage(); renderMenu(); renderCabang();
  if(!activeCabang) openCabangPicker(true);
</script>
</body>
</html>
